openapi: 3.1.0
info:
  title: order-service
  version: 1.0.0
  description: Contrato esperado independiente para Lab 01. No sobrescribir desde
    /openapi.json.
servers:
- url: http://localhost:8001
paths:
  /api/v1/orders:
    post:
      operationId: createOrder
      responses:
        '201':
          description: Resultado esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '422':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
    get:
      operationId: listOrders
      responses:
        '200':
          description: Resultado esperado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      responses:
        '200':
          description: Resultado esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      parameters:
      - name: order_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /api/v1/orders/{order_id}/cancel:
    patch:
      operationId: cancelOrder
      responses:
        '200':
          description: Resultado esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '409':
          description: Conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      parameters:
      - name: order_id
        in: path
        required: true
        schema: *id001
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Resultado esperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: healthy
                  service:
                    type: string
                    const: order-service
                required:
                - status
                - service
                additionalProperties: false
components:
  schemas:
    OrderItemCreate:
      type: object
      properties:
        product_id: *id001
        quantity: &id002
          type: integer
          minimum: 1
          maximum: 1000
        unit_price: &id003
          type: string
          pattern: ^([1-9][0-9]{0,5}\.[0-9]{2}|0\.(0[1-9]|[1-9][0-9]))$
      required:
      - product_id
      - quantity
      - unit_price
      additionalProperties: false
    OrderItemResponse:
      type: object
      properties:
        product_id: *id001
        quantity: *id002
        unit_price: *id003
        subtotal: &id004
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
      required:
      - product_id
      - quantity
      - unit_price
      - subtotal
      additionalProperties: false
    OrderCreate:
      type: object
      properties:
        customer_id: *id001
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemCreate'
          minItems: 1
          maxItems: 100
      required:
      - customer_id
      - items
      additionalProperties: false
    OrderResponse:
      type: object
      properties:
        id: *id001
        customer_id: *id001
        status:
          type: string
          enum:
          - pending
          - confirmed
          - shipped
          - delivered
          - cancelled
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        total: *id004
        created_at:
          type: string
          format: date-time
      required:
      - id
      - customer_id
      - status
      - items
      - total
      - created_at
      additionalProperties: false
    BusinessError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      additionalProperties: false
    ValidationError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
            - loc
            - msg
            - type
            properties:
              loc:
                type: array
                items:
                  anyOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
            additionalProperties: true
      additionalProperties: false
