name: micr-lab05
services:
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
    - 8001:8001
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
    - 8002:8002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
