
deployment:
  replicas: 1

image:
  tag: v3.7.14

service:
  type: ClusterIP

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    namespaces:
      - microservices

  kubernetesIngress:
    enabled: false

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
