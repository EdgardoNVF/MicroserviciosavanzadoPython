global:
  tlsDisable: true
injector:
  enabled: false
server:
  dev:
    enabled: true
    devRootToken: lab07-root-only-admin
  serviceAccount:
    create: true
    name: vault
  dataStorage:
    enabled: false
  auditStorage:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
ui:
  enabled: false
