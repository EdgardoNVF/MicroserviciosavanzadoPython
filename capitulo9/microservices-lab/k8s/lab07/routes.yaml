apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lab07-secrets
  namespace: microservices
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`microservices.local`) && Path(`/api/v1/lab07/orders`)
      services:
        - name: order-service
          port: 8001
    - kind: Rule
      match: Host(`microservices.local`) && Path(`/api/v1/lab07/inventory`)
      services:
        - name: inventory-service
          port: 8002
