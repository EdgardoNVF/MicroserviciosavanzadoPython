spec:
  template:
    spec:
      serviceAccountName: orders-vault
      automountServiceAccountToken: false
      volumes:
        - name: vault-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600
      containers:
        - name: order-service
          image: order-service:lab07
          imagePullPolicy: Never
          env:
            - name: VAULT_ENABLED
              value: "true"
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: lab07-orders
            - name: VAULT_KV_MOUNT
              value: lab07
            - name: VAULT_SECRET_PATH
              value: orders
            - name: VAULT_JWT_FILE
              value: /var/run/vault/token
          volumeMounts:
            - name: vault-identity
              mountPath: /var/run/vault
              readOnly: true
