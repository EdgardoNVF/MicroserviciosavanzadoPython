apiVersion: v1
kind: Secret
metadata:
  name: lab-credentials
  namespace: microservices
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab_admin_lab_pass
  KEYCLOAK_DB_PASSWORD: keycloak_lab_pass
  KEYCLOAK_ADMIN_PASSWORD: admin_lab_pass

  EVENTSTORE_ADMIN_DATABASE_URL: postgresql+asyncpg://lab_admin:lab_admin_lab_pass@postgres:5432/eventstore_db
  EVENTSTORE_DATABASE_URL: postgresql+asyncpg://order_app:order_app_lab_pass@postgres:5432/eventstore_db
  EVENTSTORE_ADMIN_KEY: lab-admin-key

  ORDER_SERVICE_CLIENT_ID: order-service-client
  ORDER_SERVICE_CLIENT_SECRET: order-svc-secret-lab
