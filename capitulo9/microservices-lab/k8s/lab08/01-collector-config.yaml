apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: observability
data:
  collector.yaml: "receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint:\
    \ 0.0.0.0:4318\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib:\
    \ 128\n    spike_limit_mib: 32\n  batch:\n    timeout: 1s\nexporters:\n  otlp/jaeger:\n\
    \    endpoint: jaeger:4317\n    tls:\n      insecure: true\nextensions:\n  health_check:\n\
    \    endpoint: 0.0.0.0:13133\nservice:\n  extensions:\n  - health_check\n  pipelines:\n\
    \    traces:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      - batch\n      exporters:\n      - otlp/jaeger\n"
