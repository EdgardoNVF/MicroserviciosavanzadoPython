apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yaml: "global:\n  resolve_timeout: 1m\nroute:\n  receiver: classroom\n\
    \  group_by:\n  - alertname\n  - service\n  group_wait: 5s\n  group_interval:\
    \ 10s\n  repeat_interval: 1h\nreceivers:\n- name: classroom\n"
