apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 384Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
          readOnly: false
        - name: boards
          mountPath: /etc/grafana/lab-dashboards
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/lab08.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/lab08.yaml
          subPath: dashboards.yaml
          readOnly: true
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: Lab08-Grafana!
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        emptyDir: {}
      - name: boards
        configMap:
          name: lab08-dashboard
      - name: config
        configMap:
          name: grafana-config
      securityContext:
        fsGroup: 472
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: tcp-3000
    port: 3000
    targetPort: 3000

